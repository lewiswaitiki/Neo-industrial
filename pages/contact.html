<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact – NEO-INDUSTRIAL SMART</title>
    <meta name="description" content="Get in touch with NEO-INDUSTRIAL SMART ENTERPRISES LTD via phone, email, or WhatsApp.">
    <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
    <!-- Header -->
    <header class="site-header" data-include="/components/header.html"></header>

    <!-- Contact Section -->
    <main>
        <section id="contact" class="contact section reveal">
        <header class="section-header">
            <h2>Contact Us</h2>
            <p>We’re here to help — reach out anytime.</p>
        </header>

        <!-- Contact Form -->
        <form class="contact-form" action="mailto:info@neo-industrial.com" method="post" enctype="text/plain">
            <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn primary">Send Message</button>
        </form>

        <!-- CTA Buttons -->
        <div class="contact-cta">
            <a href="tel:+254700000000" class="btn secondary">📞 Call Us</a>
            <a href="mailto:info@neo-industrial.com" class="btn secondary">✉️ Email Us</a>
            <a href="https://wa.me/254700000000" target="_blank" class="btn secondary">💬 WhatsApp</a>
        </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer reveal" data-include="/components/footer.html"></footer>

    <script src="/assets/js/app.js" defer></script>
</body>
</html>
