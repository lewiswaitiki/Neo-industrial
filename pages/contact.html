<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact – NEO-INDUSTRIAL SMART</title>
    <meta name="description"
        content="Get in touch with NEO-INDUSTRIAL SMART ENTERPRISES LTD via phone, email, or WhatsApp.">
    <link rel="stylesheet" href="/assets/css/contacts.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
    <!-- Header -->
    <header class="site-header" data-include="/components/header.html"></header>

    <!-- Contact Section -->
    <main>
        <section id="contact" class="contact section reveal">
            <header class="section-header">
                <h2>Reach Out To Us</h2>
                <p>Fill out the form and our team will get back to you within 24 hours.</p>
            </header>

            <div class="contact-grid">
                <!-- Left: Contact Info -->
                <div class="contact-info">
                    <h3>Contact Details</h3>
                    <p><i class="fa-solid fa-phone"></i><strong>Phone:</strong> <a href="tel:+254700000000">+254 700 000
                            000</a></p>
                    <p><i class="fas fa-envelope"></i><strong>Email:</strong> <a
                            href="mailto:info@neo-industrial.com">info@neo-industrial.com</a></p>
                    <p><strong>Address:</strong> Vekaria Hse, Taveta Rd, Nairobi</p>

                    <div class="social-icons">
                        <a href="#"><img src="/assets/images/facebook.png" alt="Facebook"></a>
                        <a href="#"><img src="/assets/images/whatsapp.png" alt="Whatsapp"></a>
                        <a href="#"><img src="/assets/images/instagram.png" alt="Instagram"></a>
                    </div>
                </div>

                <!-- Right: Form -->
                <form class="contact-form" action="mailto:info@neo-industrial.com" method="post" enctype="text/plain">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn--primary">Send Message</button>
                </form>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer reveal" data-include="/components/footer.html"></footer>

    <script src="/assets/js/app.js" defer></script>
</body>

</html>
